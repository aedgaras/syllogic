name: syllogic

# Caps container log size on disk; without this the default json-file driver
# grows unbounded. Applied to every long-running service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: syllogic-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: syllogic-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  uploads-init:
    image: alpine:3.20
    container_name: syllogic-uploads-init
    command: ["sh", "-c", "mkdir -p /uploads/profile /uploads/logos /uploads/imports /uploads/people && chown -R 1000:1000 /uploads"]
    volumes:
      - uploads_data:/uploads
    restart: "no"

  # One-shot DB migrations (Drizzle SQL migrations).
  migrate:
    image: ${FRONTEND_IMAGE:-ghcr.io/aedgaras/syllogic-frontend}:${APP_VERSION:-edge}
    container_name: syllogic-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/migrate.js"]
    restart: "no"

  # One-shot backend-only schema migrations (tables/columns Drizzle doesn't
  # own). See backend/postgres_migration/run_all.py.
  backend-migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/aedgaras/syllogic-backend}:${APP_VERSION:-edge}
    container_name: syllogic-backend-migrate
    command: python postgres_migration/run_all.py
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/aedgaras/syllogic-backend}:${APP_VERSION:-edge}
    container_name: syllogic-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_URL: ${APP_URL:-http://localhost:8080}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-${APP_URL:-http://localhost:8080}}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?set INTERNAL_AUTH_SECRET in .env}
      DATA_ENCRYPTION_KEY_CURRENT: ${DATA_ENCRYPTION_KEY_CURRENT:-}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-k1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      ERROR_REPORTING_WEBHOOK_URL: ${ERROR_REPORTING_WEBHOOK_URL:-}
      # Optional integrations / features
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CATEGORIZATION_LLM_MODEL: ${CATEGORIZATION_LLM_MODEL:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health/ready actually touches Postgres and Redis (unlike /health,
      # which only proves the process is alive) so a dead dependency here
      # trips the restart policy instead of being reported healthy forever.
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,urllib.request; urllib.request.urlopen(os.environ.get('BACKEND_HEALTHCHECK_URL','http://localhost:8000/health/ready')).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  # MCP server (FastMCP) for Claude Desktop / programmatic access.
  #
  # Internal service port is fixed at 8001.
  # Best treated as single-user: bound to loopback by default so it is not
  # reachable from the network. Set MCP_BIND_ADDR=0.0.0.0 (and put it behind
  # Caddy/a VPN) to expose it deliberately. External host port defaults to
  # 8001 and is configurable via MCP_PORT.
  mcp:
    image: ${BACKEND_IMAGE:-ghcr.io/aedgaras/syllogic-backend}:${APP_VERSION:-edge}
    container_name: syllogic-mcp
    command: uvicorn mcp_server:app --host 0.0.0.0 --port 8001
    environment:
      PROCESS_TYPE: mcp
      PORT: "8001"
      APP_URL: ${APP_URL:-http://localhost:8080}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8001}
      DATABASE_URL: ${DATABASE_URL}
      DATA_ENCRYPTION_KEY_CURRENT: ${DATA_ENCRYPTION_KEY_CURRENT:-}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-k1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Optional integrations / features
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CATEGORIZATION_LLM_MODEL: ${CATEGORIZATION_LLM_MODEL:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    ports:
      - "${MCP_BIND_ADDR:-127.0.0.1}:${MCP_PORT:-8001}:8001"
    logging: *default-logging
    restart: unless-stopped

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/aedgaras/syllogic-backend}:${APP_VERSION:-edge}
    container_name: syllogic-worker
    command: celery -A celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} --pool=${CELERY_POOL:-prefork}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_URL: ${APP_URL:-http://localhost:8080}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-${APP_URL:-http://localhost:8080}}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      DATA_ENCRYPTION_KEY_CURRENT: ${DATA_ENCRYPTION_KEY_CURRENT:-}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-k1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Optional integrations / features
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CATEGORIZATION_LLM_MODEL: ${CATEGORIZATION_LLM_MODEL:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    logging: *default-logging
    restart: unless-stopped

  beat:
    image: ${BACKEND_IMAGE:-ghcr.io/aedgaras/syllogic-backend}:${APP_VERSION:-edge}
    container_name: syllogic-beat
    command: celery -A celery_app beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_URL: ${APP_URL:-http://localhost:8080}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-${APP_URL:-http://localhost:8080}}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      DATA_ENCRYPTION_KEY_CURRENT: ${DATA_ENCRYPTION_KEY_CURRENT:-}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-k1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Optional integrations / features
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CATEGORIZATION_LLM_MODEL: ${CATEGORIZATION_LLM_MODEL:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    logging: *default-logging
    restart: unless-stopped

  app:
    image: ${FRONTEND_IMAGE:-ghcr.io/aedgaras/syllogic-frontend}:${APP_VERSION:-edge}
    container_name: syllogic-app
    read_only: true
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL:-http://localhost:8080}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:8080}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${APP_URL:-http://localhost:8080}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?set INTERNAL_AUTH_SECRET in .env}
      DATA_ENCRYPTION_KEY_CURRENT: ${DATA_ENCRYPTION_KEY_CURRENT:-}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-k1}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      # Absolute path: files live on a persistent volume outside the build
      # output and are served via the /uploads/* route handler.
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/uploads}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXT_PUBLIC_LOG_LEVEL: ${NEXT_PUBLIC_LOG_LEVEL:-warn}
      # Optional features
      LOGO_DEV_API_KEY: ${LOGO_DEV_API_KEY:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    volumes:
      - uploads_data:/data/uploads
    tmpfs:
      - /tmp
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch(process.env.APP_HEALTHCHECK_URL || 'http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: syllogic-caddy
    profiles: ["caddy"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
